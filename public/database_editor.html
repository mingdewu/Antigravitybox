<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remotion 动态分镜数据库工作台 (16:9 长视频自动剪辑)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-[var(--background,#0b0f17)] text-[var(--foreground,#f1f5f9)] p-4 sm:p-6 font-sans antialiased">

  <!-- 顶部标题与控制工具栏 -->
  <div class="mb-5 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[var(--card,#131c2e)] p-4 rounded-xl border border-[var(--border,#1e293b)] shadow-sm">
    <div>
      <div class="flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-sky-500 animate-pulse"></span>
        <h1 class="text-base font-bold text-white tracking-tight">动态分镜数据库工作台 (16:9 长视频)</h1>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-mono font-bold">无限镜头 · 动态增删</span>
      </div>
      <p class="text-xs text-slate-400 mt-1">
        每一行对应一句台词、关联场景与右侧 16:9 实拍图片。支持任意自由添加、删除、排序，完全打破镜头数量限制！
      </p>
    </div>

    <!-- 状态指示与快捷操作 -->
    <div class="flex flex-wrap items-center gap-2.5">
      <div class="text-xs bg-slate-900/80 border border-slate-700/60 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
        <span class="text-slate-400">分镜总数:</span>
        <span class="font-bold text-sky-400" id="totalShotsCount">0 个镜头</span>
      </div>
      <div class="text-xs bg-slate-900/80 border border-slate-700/60 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
        <span class="text-slate-400">成片总长:</span>
        <span class="font-bold text-emerald-400" id="totalDurationText">0.0 秒</span>
      </div>
      <button onclick="addNewShot()" class="text-xs bg-sky-600 hover:bg-sky-500 text-white font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-sm transition cursor-pointer">
        <span>➕</span> 添加分镜
      </button>
      <button onclick="downloadDatabaseJSON()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg font-medium flex items-center gap-1 transition cursor-pointer">
        <span>💾</span> 导出 JSON
      </button>
      <button onclick="copyDatabaseJSON()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg font-medium flex items-center gap-1 transition cursor-pointer">
        <span>📋</span> 复制配置
      </button>
    </div>
  </div>

  <!-- 数据库风格主表格容器 -->
  <div class="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900/60 shadow-sm">
    <table class="w-full text-left border-collapse min-w-[960px]">
      <thead>
        <tr class="border-b border-slate-800 bg-slate-900/90 text-xs font-semibold text-slate-400">
          <th class="py-3 px-3 w-14 text-center">序号</th>
          <th class="py-3 px-4 w-[34%]">第二列：台词 / 旁白解说 (Dialogue)</th>
          <th class="py-3 px-4 w-[28%]">第三列：对应场景设定 (Scene)</th>
          <th class="py-3 px-4 w-[32%]">第四列：右侧是否上传图片与 16:9 裁剪</th>
          <th class="py-3 px-3 w-16 text-center">操作</th>
        </tr>
      </thead>
      <tbody id="databaseTableBody" class="divide-y divide-slate-800/80 text-xs">
        <!-- 由 JavaScript 动态渲染 N 个镜头行 -->
      </tbody>
    </table>
  </div>

  <!-- 底部添加按钮与说明栏 -->
  <div class="mt-4 flex flex-col sm:flex-row items-center justify-between gap-3 p-3.5 bg-slate-900/80 border border-slate-800 rounded-xl text-xs text-slate-400">
    <div class="flex items-center gap-2">
      <span class="text-base">✂️</span>
      <span>
        <b>16:9 智能剪裁引擎</b>：上传任意构图照片（手机 4:3、竖屏 9:16、单反 3:2），系统均会自动居中<b>裁剪为标准的 1920×1080 电影画幅</b>，并施加缓慢推拉微动效！
      </span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="addNewShot()" class="text-xs bg-sky-600/90 hover:bg-sky-500 text-white font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-sm transition cursor-pointer">
        <span>➕</span> 添加新分镜镜头
      </button>
      <button onclick="promptImportJSON()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg font-medium transition cursor-pointer">
        <span>📥</span> 导入配置
      </button>
    </div>
  </div>

  <script>
    // 初始化分镜数据库 (支持从 public/database_rows.json 动态读取或使用默认模板)
    let databaseRows = [];

    const DEFAULT_INIT_DATA = [
      {
        id: 1,
        badge: 'SHOT #01',
        dialogue: '这次我们租车自驾四国，沿着海岸线计划开三百多公里。',
        sceneTitle: '德岛启程 · 四国路线全貌',
        sceneType: 'map-intro',
        sceneDescription: '卫星路线全览展开，交代自驾里程与环岛第一天出发定位。',
        isPhotoUploaded: true,
        photoFileName: 'shot_03_highway.jpg',
        photoEffect: 'zoom-in',
        clipDurationSeconds: 5.0,
        transitionType: 'fade'
      },
      {
        id: 2,
        badge: 'SHOT #02',
        dialogue: '第一站直接开到鸣门大桥，桥下海风大得几乎拿不稳相机。',
        sceneTitle: 'STOP 01 · 德岛鸣门大漩涡',
        sceneType: 'map-poi-naruto',
        sceneDescription: '大鸣门桥下俯瞰激流回旋，长焦捕捉海浪冲撞细节。',
        isPhotoUploaded: true,
        photoFileName: 'shot_03_highway.png',
        photoEffect: 'subtle-float',
        clipDurationSeconds: 5.0,
        transitionType: 'slide'
      },
      {
        id: 3,
        badge: 'SHOT #03',
        dialogue: '中途穿过四国中央山脉，山里一直在下着小阵雨，路特别窄。',
        sceneTitle: '盘山公路 · 跨山隧道与弯道实拍',
        sceneType: 'photo-transport',
        sceneDescription: '四国中央山地公路雨中穿行，车窗抓拍与连续弯道路况。',
        isPhotoUploaded: true,
        photoFileName: 'shot_03_highway.jpg',
        photoEffect: 'zoom-out',
        clipDurationSeconds: 5.5,
        transitionType: 'fade'
      },
      {
        id: 4,
        badge: 'SHOT #04',
        dialogue: '下午四点多终于开到高知的桂滨，太平洋的浪特别高。',
        sceneTitle: 'STOP 02 · 高知桂滨海岸',
        sceneType: 'map-poi-katsura',
        sceneDescription: '桂滨断崖海湾，下午侧逆光下的巨浪拍打防波堤与礁石。',
        isPhotoUploaded: false,
        photoFileName: 'shot_04_katsurahama.jpg',
        photoEffect: 'zoom-in',
        clipDurationSeconds: 5.0,
        transitionType: 'slide'
      },
      {
        id: 5,
        badge: 'SHOT #05',
        dialogue: '在沙滩边走了一圈，鞋里全进了沙子，但夕阳的光线正好落下来。',
        sceneTitle: '岸边漫步 · 礁石与浪花光影抓拍',
        sceneType: 'photo-scenery',
        sceneDescription: '抓拍太平洋浪花涌向沙滩的瞬间，纪实光影特写。',
        isPhotoUploaded: false,
        photoFileName: 'shot_05_beach_walk.jpg',
        photoEffect: 'pan-right',
        clipDurationSeconds: 5.5,
        transitionType: 'fade'
      },
      {
        id: 6,
        badge: 'SHOT #06',
        dialogue: '天黑前赶到了松山的道后温泉，这里的木头老建筑特别有质感。',
        sceneTitle: 'STOP 03 · 松山道后温泉本馆',
        sceneType: 'map-poi-dogo',
        sceneDescription: '傍晚亮灯的千年古汤本馆木质外立面与温泉街市井氛围。',
        isPhotoUploaded: false,
        photoFileName: 'shot_06_dogo_onsen.jpg',
        photoEffect: 'zoom-in',
        clipDurationSeconds: 5.2,
        transitionType: 'slide'
      },
      {
        id: 7,
        badge: 'SHOT #07',
        dialogue: '一天开下来挺累的，不过拍到了不少满意的照片。先回酒店休息了。',
        sceneTitle: '旅程收尾 · 暮色余晖与行程回顾',
        sceneType: 'photo-outro',
        sceneDescription: '暮色中的松山市区远眺收束，完成当天行程记录归档。',
        isPhotoUploaded: false,
        photoFileName: 'shot_07_sunset.jpg',
        photoEffect: 'subtle-float',
        clipDurationSeconds: 5.5,
        transitionType: 'fade'
      }
    ];

    // 尝试拉取当前工程的配置，拉取不到则用初始配置
    fetch('database_rows.json')
      .then(res => {
        if (!res.ok) throw new Error('Not found');
        return res.json();
      })
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          databaseRows = data;
        } else {
          databaseRows = DEFAULT_INIT_DATA;
        }
        reindexRows();
        renderTable();
      })
      .catch(() => {
        databaseRows = DEFAULT_INIT_DATA;
        reindexRows();
        renderTable();
      });

    // 重新排序并规范编号
    function reindexRows() {
      databaseRows.forEach((row, idx) => {
        row.id = idx + 1;
        row.badge = `SHOT #${String(row.id).padStart(2, '0')}`;
      });
      updateStats();
    }

    function updateStats() {
      const countEl = document.getElementById('totalShotsCount');
      const durationEl = document.getElementById('totalDurationText');
      if (countEl) countEl.innerText = `${databaseRows.length} 个镜头`;
      
      const totalSec = databaseRows.reduce((acc, r) => acc + (parseFloat(r.clipDurationSeconds) || 5.0), 0);
      const totalFrames = Math.round(totalSec * 30);
      if (durationEl) durationEl.innerText = `${totalSec.toFixed(1)} 秒 (${totalFrames} 帧)`;
    }

    function renderTable() {
      const tbody = document.getElementById('databaseTableBody');
      tbody.innerHTML = '';

      databaseRows.forEach((row, idx) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/40 transition-colors';

        tr.innerHTML = `
          <!-- 1. 编号 -->
          <td class="py-3 px-3 text-center align-top pt-4">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-sky-400 text-xs font-mono font-bold shadow-xs">
              ${row.id}
            </span>
            <div class="flex flex-col gap-1 items-center mt-2">
              <button onclick="moveRow(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} class="w-6 h-5 flex items-center justify-center text-[10px] bg-slate-800 hover:bg-slate-700 disabled:opacity-20 text-slate-300 rounded cursor-pointer" title="上移">▲</button>
              <button onclick="moveRow(${idx}, 1)" ${idx === databaseRows.length - 1 ? 'disabled' : ''} class="w-6 h-5 flex items-center justify-center text-[10px] bg-slate-800 hover:bg-slate-700 disabled:opacity-20 text-slate-300 rounded cursor-pointer" title="下移">▼</button>
            </div>
          </td>

          <!-- 2. 台词/旁白 -->
          <td class="py-3 px-4 align-top">
            <textarea 
              oninput="updateField(${idx}, 'dialogue', this.value)"
              rows="3" 
              placeholder="输入该分镜的台词或解说旁白文案..."
              class="w-full p-2.5 bg-slate-900 border border-slate-700/80 rounded-lg text-xs text-slate-200 resize-none focus:outline-none focus:ring-1 focus:ring-sky-500 transition leading-relaxed"
            >${row.dialogue || ''}</textarea>
            <div class="flex justify-between items-center text-[10px] text-slate-400 mt-1.5 px-0.5">
              <span>字数: ${(row.dialogue || '').length} 字</span>
              <div class="flex items-center gap-1">
                <span>镜头时长:</span>
                <input 
                  type="number" 
                  step="0.1" 
                  min="1" 
                  value="${row.clipDurationSeconds || 5.0}" 
                  onchange="updateField(${idx}, 'clipDurationSeconds', parseFloat(this.value) || 5.0)" 
                  class="w-14 bg-slate-800 border border-slate-700 rounded px-1.5 py-0.5 text-right text-sky-400 font-mono font-bold"
                />
                <span>秒</span>
              </div>
            </div>
          </td>

          <!-- 3. 对应场景 -->
          <td class="py-3 px-4 align-top">
            <div class="flex items-center gap-2 mb-2">
              <select 
                onchange="updateField(${idx}, 'sceneType', this.value)"
                class="bg-slate-800 border border-slate-700 text-sky-300 font-semibold text-[11px] rounded px-2 py-1 focus:outline-none"
              >
                <option value="map-intro" ${row.sceneType === 'map-intro' ? 'selected' : ''}>🌐 地图宏观巡礼</option>
                <option value="map-poi-naruto" ${row.sceneType === 'map-poi-naruto' ? 'selected' : ''}>📍 地图鸣门特写</option>
                <option value="map-poi-katsura" ${row.sceneType === 'map-poi-katsura' ? 'selected' : ''}>📍 地图桂滨特写</option>
                <option value="map-poi-dogo" ${row.sceneType === 'map-poi-dogo' ? 'selected' : ''}>📍 地图道后特写</option>
                <option value="photo-transport" ${row.sceneType === 'photo-transport' ? 'selected' : ''}>🚗 交通行进实拍</option>
                <option value="photo-scenery" ${row.sceneType === 'photo-scenery' ? 'selected' : ''}>🌄 自然风光实拍</option>
                <option value="photo-outro" ${row.sceneType === 'photo-outro' ? 'selected' : ''}>🎬 旅途终章收尾</option>
              </select>
            </div>
            <input 
              type="text" 
              value="${row.sceneTitle || ''}" 
              placeholder="场景主标题 (如: STOP 01 · 鸣门大漩涡)"
              oninput="updateField(${idx}, 'sceneTitle', this.value)"
              class="w-full mb-1.5 px-2.5 py-1.5 bg-slate-900 border border-slate-700/80 rounded-md text-xs font-bold text-slate-100 focus:outline-none focus:ring-1 focus:ring-sky-500"
            />
            <textarea 
              rows="2"
              placeholder="场景细节描述..."
              oninput="updateField(${idx}, 'sceneDescription', this.value)"
              class="w-full p-2 bg-slate-900/60 border border-slate-800 rounded-md text-[11px] text-slate-400 resize-none focus:outline-none"
            >${row.sceneDescription || ''}</textarea>
          </td>

          <!-- 4. 右侧是否上传图片与 16:9 剪裁 -->
          <td class="py-3 px-4 align-top">
            <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 flex flex-col gap-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                  <span>📷</span> 是否上传实拍图片:
                </span>
                <label class="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" onchange="toggleUpload(${idx}, this.checked)" ${row.isPhotoUploaded ? 'checked' : ''} class="sr-only peer">
                  <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                </label>
              </div>

              <!-- 状态与 16:9 剪辑参数 -->
              <div class="pt-2 border-t border-slate-800 text-[11px]">
                ${row.isPhotoUploaded ? `
                  <div class="text-emerald-400 font-bold flex items-center gap-1">
                    <span>✓</span> 已启用 16:9 智能裁剪与长视频呈现
                  </div>
                  <div class="text-slate-400 mt-2 flex flex-col gap-1.5">
                    <div class="flex items-center gap-1.5">
                      <span class="text-slate-400">图片文件名:</span>
                      <input 
                        type="text" 
                        value="${row.photoFileName || `shot_${String(row.id).padStart(2, '0')}.jpg`}" 
                        oninput="updateField(${idx}, 'photoFileName', this.value)"
                        class="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs font-mono text-slate-200"
                      />
                    </div>
                    <div class="flex items-center justify-between mt-1">
                      <div class="flex items-center gap-1">
                        <span>动效:</span>
                        <select 
                          onchange="updateField(${idx}, 'photoEffect', this.value)"
                          class="bg-slate-800 border border-slate-700 text-sky-400 text-[11px] rounded px-1.5 py-0.5"
                        >
                          <option value="zoom-in" ${row.photoEffect === 'zoom-in' ? 'selected' : ''}>缓慢推镜 (Zoom In)</option>
                          <option value="zoom-out" ${row.photoEffect === 'zoom-out' ? 'selected' : ''}>缓慢拉远 (Zoom Out)</option>
                          <option value="pan-right" ${row.photoEffect === 'pan-right' ? 'selected' : ''}>水平向右平移 (Pan Right)</option>
                          <option value="subtle-float" ${row.photoEffect === 'subtle-float' ? 'selected' : ''}>呼吸微浮 (Subtle Float)</option>
                        </select>
                      </div>
                      <span class="text-emerald-400 font-bold">16:9 自动居中裁切</span>
                    </div>
                  </div>
                ` : `
                  <div class="text-sky-400 font-medium flex items-center gap-1">
                    <span>⚡</span> 默认模式: 自动调度卫星地图与路线漫游
                  </div>
                  <div class="text-slate-400 mt-1 text-[11px]">
                    放入照片到 <code>public/photos/</code> 并勾选上方开关即可替换为 16:9 实拍图
                  </div>
                `}
              </div>
            </div>
          </td>

          <!-- 5. 操作：删除 -->
          <td class="py-3 px-3 text-center align-top pt-4">
            <button 
              onclick="deleteShot(${idx})" 
              class="p-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 transition cursor-pointer"
              title="删除此分镜"
            >
              🗑️
            </button>
          </td>
        `;

        tbody.appendChild(tr);
      });

      updateStats();
    }

    function updateField(idx, key, val) {
      databaseRows[idx][key] = val;
      updateStats();
    }

    function toggleUpload(idx, checked) {
      databaseRows[idx].isPhotoUploaded = checked;
      renderTable();
    }

    function addNewShot() {
      const nextId = databaseRows.length + 1;
      const newShot = {
        id: nextId,
        badge: `SHOT #${String(nextId).padStart(2, '0')}`,
        dialogue: '在这里输入新镜头的旁白解说文案...',
        sceneTitle: `全新镜头 · 分镜 #${nextId}`,
        sceneType: 'photo-scenery',
        sceneDescription: '实拍风景照片展示，自动裁剪为 16:9 画幅。',
        isPhotoUploaded: false,
        photoFileName: `shot_${String(nextId).padStart(2, '0')}.jpg`,
        photoEffect: 'zoom-in',
        clipDurationSeconds: 5.0,
        transitionType: 'fade'
      };
      databaseRows.push(newShot);
      reindexRows();
      renderTable();
    }

    function deleteShot(idx) {
      if (databaseRows.length <= 1) {
        alert('至少需要保留 1 个分镜镜头！');
        return;
      }
      if (confirm(`确定要删除镜头 #${databaseRows[idx].id} 吗？`)) {
        databaseRows.splice(idx, 1);
        reindexRows();
        renderTable();
      }
    }

    function moveRow(idx, direction) {
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= databaseRows.length) return;
      const temp = databaseRows[idx];
      databaseRows[idx] = databaseRows[targetIdx];
      databaseRows[targetIdx] = temp;
      reindexRows();
      renderTable();
    }

    function copyDatabaseJSON() {
      const json = JSON.stringify(databaseRows, null, 2);
      navigator.clipboard.writeText(json).then(() => {
        alert(`✓ 已成功复制当前全部 ${databaseRows.length} 个镜头的配置数据！`);
      });
    }

    function downloadDatabaseJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(databaseRows, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "database_rows.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function promptImportJSON() {
      const input = prompt('请粘贴 JSON 分镜数组配置数据:');
      if (input) {
        try {
          const parsed = JSON.parse(input);
          if (Array.isArray(parsed)) {
            databaseRows = parsed;
            reindexRows();
            renderTable();
            alert(`✓ 成功导入 ${databaseRows.length} 个分镜！`);
          } else {
            alert('❌ 导入格式有误，必须为 JSON 数组！');
          }
        } catch (e) {
          alert('❌ JSON 解析失败: ' + e.message);
        }
      }
    }
  </script>
</body>
</html>
